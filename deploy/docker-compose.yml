services:
  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    command: ["gunicorn", "backend.wsgi:application", "--bind", "0.0.0.0:8000"]
    env_file:
      - ../.env
    environment:
      OPENSEARCH_HOST: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-jlaw-current}
      OPENSEARCH_DIET_INDEX: ${OPENSEARCH_DIET_INDEX:-jdiet-current}
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:4173"

volumes:
  opensearch-data:
