name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint / typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend indexer tests

      - name: Ruff format check
        run: ruff format --check backend indexer tests

      - name: Mypy
        run: mypy backend indexer tests

      - name: Pytest
        run: pytest --cov=backend --cov=indexer --cov-report=term-missing

  integration:
    name: OpenSearch integration
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.9.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          bootstrap.memory_lock: "false"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Integration tests
        env:
          DJANGO_SECRET_KEY: test-only-insecure-secret-key
          OPENSEARCH_HOST: http://127.0.0.1:9200
          OPENSEARCH_NUMBER_OF_SHARDS: "1"
        run: pytest -q -m integration

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check (lint / format / typecheck / test / build)
        run: npm run check
