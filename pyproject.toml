[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "indexer/data",
  ".venv",
  "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "search", "indexer"]

[tool.pytest.ini_options]
testpaths = ["backend/search/tests", "backend/backend/tests", "tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["backend", "indexer"]
omit = [
  "*/tests/*",
  "indexer/data/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
cache_dir = "tmp/mypy_cache"
sqlite_cache = false
exclude = [
  "indexer/data/",
  "frontend/",
  ".venv/",
]

[[tool.mypy.overrides]]
module = ["backend.*", "indexer.*", "search.*"]
check_untyped_defs = true
