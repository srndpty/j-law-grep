repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: '.venv\\Scripts\\python.exe -m ruff check'
        language: system
        types_or: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        entry: '.venv\\Scripts\\python.exe -m ruff format --check'
        language: system
        types_or: [python]
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: '.venv\\Scripts\\python.exe -m mypy backend indexer tests'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: '.venv\\Scripts\\python.exe -m pytest'
        language: system
        pass_filenames: false
      - id: frontend-check
        name: frontend lint/test/build
        entry: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location frontend; npm run check"
        language: system
        pass_filenames: false
