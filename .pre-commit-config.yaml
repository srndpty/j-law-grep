repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python scripts/precommit-python.py -m ruff check
        language: system
        types_or: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        entry: python scripts/precommit-python.py -m ruff format --check
        language: system
        types_or: [python]
        pass_filenames: true
      # コミットの軽量化のため、mypy / pytest は pre-commit に含めない。
      # フル品質ゲートは `make check` (手動) と CI (.github/workflows/ci.yml) で担保する:
      #   - mypy backend indexer tests
      #   - pytest (unit + integration)
      #   - frontend lint/test/build
      - id: frontend-check
        name: frontend lint/test/build
        entry: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location frontend; npm run check"
        language: system
        pass_filenames: false
